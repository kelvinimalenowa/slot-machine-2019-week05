<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="This is where your description goes">
	<meta name="keywords" content="one, two, three">

	<title>LUCKY MART SLOT MACHINE</title>

	<link rel="stylesheet" href="css/normalize.css">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<section class="machine-top">
		<h2>LUCKY MART</h2>
		<p>→ OPEN 24 / 7 →</p>
	</section>


	<div id="machine">

		<section id="reel-container">
			<section>
				<p class="slot" id="reel1"></p>
			</section>
			<section>
				<p class="slot" id="reel2"></p>
			</section>
			<section>
				<p class="slot" id="reel3"></p>
			</section>
		</section>

		<p id="result"></p>

		<section class="balance-section">
			<p>BALANCE</p>
			<p id="balance"></p>
		</section>

		<section class="buttons">
			<button type="number" class="bet-button" name="bet" id="max-bet">Max  $50</button>
			<button type="button" class="bet-button" name="button" id="min-bet">Min  $5</button>
			<p>PAYOUT 2X</p>
		</section>
	</div>


	<script type="text/javascript" src="js/main.js"></script>
</body>

</html>
